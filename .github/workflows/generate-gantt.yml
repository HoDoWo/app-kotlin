name: Generate Gantt Comparison Chart

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight (optional)

jobs:
  build-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write # Required to create the pull request automatically

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Gantt Generator Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_gantt.py

      - name: Create Pull Request with Updated Chart
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-update Gantt comparison chart"
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          branch: feature/auto-gantt-update
          delete-branch: true
          title: "📊 Auto-update Project Gantt Comparison Chart"
          body: |
            Automated update of the project Gantt comparison chart (`docs/gantt-chart.md`).
            Generated via GitHub Actions.
