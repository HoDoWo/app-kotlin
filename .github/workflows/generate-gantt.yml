name: Generate Gantt Comparison Chart

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight (optional)

jobs:
  build-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Gantt Generator Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/generate_gantt.py

      - name: Commit and push updated chart branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B feature/auto-gantt-update
          git add docs/gantt-chart.md
          if git diff --cached --quiet; then
            echo "No chart changes detected."
            exit 0
          fi
          git commit -m "Auto-update Gantt comparison chart"
          git push --force-with-lease origin feature/auto-gantt-update
