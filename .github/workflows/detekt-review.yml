name: Revisión de Kotlin (Detekt)

on:
  pull_request:

jobs:
  detekt:
    name: Buscar código mal en Kotlin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App-HoDoWo
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al wrapper
        run: chmod +x ./gradlew

      - name: Ejecutar Detekt
        run: ./gradlew detekt
